<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mean AI - បកប្រែវីដេអូ AI ភាសាខ្មែរ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Preahvihear&family=Siemreap&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Siemreap', sans-serif; background-color: #0B0F19; color: #f3f4f6; }
        .font-bokor { font-family: 'Preahvihear', sans-serif; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-center">
    <div class="w-full max-w-md bg-[#131B2E] rounded-2xl p-6 shadow-2xl border border-red-900/30">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-red-500 font-bokor">Mean AI 🎬</h1>
            <p class="text-sm text-gray-400 mt-1">ប្រព័ន្ធបកប្រែវីដេអូទៅជាភាសាខ្មែរ និង Subtitle ស្ដង់ដារ Premium</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">បញ្ចូលដំណរភ្ជាប់ (URL) វីដេអូគ្រប់បណ្តាញសង្គម</label>
                <input type="text" placeholder="https://..." class="w-full px-4 py-3 bg-[#0B0F19] border border-gray-700 rounded-xl focus:outline-none focus:border-red-600 text-sm text-white">
            </div>

            <div class="text-center text-gray-500 text-xs">ឬ</div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">ជ្រើសរើសឯកសារវីដេអូពីក្នុងទូរសព្ទ</label>
                <label class="flex flex-col items-center justify-center border-2 border-dashed border-red-800/50 rounded-xl p-6 cursor-pointer hover:bg-red-950/10 transition">
                    <span class="text-sm text-red-400">ចុចទីនេះដើម្បី Upload វីដេអូ</span>
                    <input type="file" class="hidden" accept="video/*">
                </label>
            </div>

            <button class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-red-900/30">
                ចាប់ផ្តើមបកប្រែ និងបង្កើត Subtitle
            </button>
        </div>
    </div>
</body>
</html>
